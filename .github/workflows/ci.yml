name: ci

# Every push and every pull request runs the same gate as `make check`, so the
# release workflow can trust the tree it publishes. The gate runs on macOS:
# the app links objc2 unconditionally, so it does not build on Linux.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt, clippy and tests
        run: make check

      - name: Check shell syntax
        run: |
          for script in .github/scripts/*.sh scripts/*.sh; do bash -n "$script"; done

      - name: Lint shell
        run: .github/scripts/lint-shell.sh
